org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# Opt out of AGP 9's built-in Kotlin; the Flutter Gradle plugin applies
# org.jetbrains.kotlin.android (declared in settings.gradle) instead.
android.builtInKotlin=false
# Opt out of AGP 9's new DSL so the Flutter Gradle plugin's Groovy DSL still applies.
android.newDsl=false

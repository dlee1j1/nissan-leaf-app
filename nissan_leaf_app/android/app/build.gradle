plugins {
    id "com.android.application"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    // Kotlin itself is applied by the Flutter Gradle Plugin (android.builtInKotlin=false),
    // using the org.jetbrains.kotlin.android plugin declared in settings.gradle.
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.example.nissan_leaf_app"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        // Required by flutter_local_notifications (and other plugins that use java.time).
        coreLibraryDesugaringEnabled = true
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.example.nissan_leaf_app"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }
    packaging {
        resources {
            // Drop duplicated metadata files that otherwise collide when merging deps.
            excludes += [
                "META-INF/DEPENDENCIES",
                "META-INF/LICENSE",
                "META-INF/LICENSE.txt",
                "META-INF/NOTICE",
                "META-INF/NOTICE.txt",
            ]
        }
    }
    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig = signingConfigs.debug
//            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

dependencies {
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.4"

    // For Google Tink dependencies
 //   implementation 'com.google.errorprone:error_prone_annotations:2.18.0'
 //   implementation 'joda-time:joda-time:2.12.5'
 //   implementation 'javax.annotation:javax.annotation-api:1.3.2'
    
    // Single HTTP client (avoids the conflict)
//    implementation 'com.google.http-client:google-http-client-android:1.42.3'
}

flutter {
    source = "../.."
}
